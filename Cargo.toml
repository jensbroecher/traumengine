[workspace]
resolver = "2"
members = [
    "crates/traum-core",
    "crates/traum-input",
    "crates/traum-sdf",
    "crates/traum-render",
    "crates/traum-editor",
    "crates/traum-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = { version = "0.29", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.21", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.8"
wgpu = "24.0"
winit = "0.30"
gilrs = "0.11"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"

# Fast dev builds for smooth 60fps real-time sculpting even in `cargo run`!
[profile.dev]
opt-level = 2
incremental = false

[profile.dev.package."*"]
opt-level = 3
